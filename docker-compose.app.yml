name: heptadec-app

services:
  api:
    build:
      context: .
      target: api
    container_name: heptadec-api
    restart: unless-stopped
    environment:
      API_PORT: 8787
      BETTER_AUTH_URL: ${PUBLIC_URL:-http://localhost:8080}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      HEPTADEC_EXTRA_ORIGINS: ${HEPTADEC_EXTRA_ORIGINS:-}
      HEPTADEC_SECRET_KEY: ${HEPTADEC_SECRET_KEY:?set HEPTADEC_SECRET_KEY in .env}
      DATABASE_URL: ${DATABASE_URL:-file:./data/heptadec.db}
      WEB_URL: ${PUBLIC_URL:-http://localhost:8080}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_EMAIL_TOKEN: ${CLOUDFLARE_EMAIL_TOKEN:-}
      CLOUDFLARE_EMAIL_FROM: ${CLOUDFLARE_EMAIL_FROM:-}
    volumes:
      - heptadec-appdata:/repo/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      target: web
    container_name: heptadec-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  heptadec-appdata: