packages:
  - "apps/*"
  - "packages/*"

# pnpm 12 blocks dependency build scripts by default.
# esbuild: required by the tsx / drizzle-kit / vite toolchains.
# better-sqlite3 + @prisma/client: pulled in by better-auth itself (its
# built-in adapters). We use the Drizzle adapter, but the packages are
# still installed, so their postinstalls must be allowed.
allowBuilds:
  esbuild: true
  better-sqlite3: true
  "@prisma/client": true
  # workerd: the local Workers runtime behind `wrangler dev`.
  workerd: true
  duckdb: true

minimumReleaseAgeExclude:
  # Mastra speaks the model through the AI SDK's provider interfaces, so the
  # versions it pins are as new as Mastra itself.
  - "@ai-sdk/provider-utils@5.0.58"
  - "@ai-sdk/provider@4.0.26"
  - "@mastra/core@1.80.0"
