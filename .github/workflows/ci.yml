name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm --filter @heptadec/web run build

      # The suite runs against the app's own SQLite file and against the eight
      # engines in the test stack, so the file needs the schema and the stack
      # needs its fixtures before a test means anything.
      - run: pnpm db:migrate

      - run: pnpm compose:test:up

      - run: pnpm seed:test

      - run: pnpm test

  images:
    name: Images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the image repository
        id: repo
        run: echo "path=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push the api image
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.path }}/api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push the web image
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.path }}/web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Summarise
        run: |
          echo "api: ${{ steps.api.outputs.digest }}"
          echo "web: ${{ steps.web.outputs.digest }}"

  worker:
    name: Worker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    # The Worker's configuration names this project's account, its D1 database
    # and its bucket, so it is written from these values rather than committed.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_PUBLIC_ID: ${{ secrets.R2_PUBLIC_ID }}
      PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      BACHS_BASE_URL: ${{ secrets.BACHS_BASE_URL }}
      BACHS_PRICE_MONTHLY: ${{ secrets.BACHS_PRICE_MONTHLY }}
      BACHS_PRICE_YEARLY: ${{ secrets.BACHS_PRICE_YEARLY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The Worker is not rolled out ahead of the schema it reads: the
      # migrations land first, so a merge that adds a migration and a Worker
      # that queries it never meet in the wrong order.
      - name: Apply database migrations
        run: pnpm db:migrate:d1

      - name: Deploy the Worker
        run: pnpm deploy:worker
